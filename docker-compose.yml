version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tourly_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourly_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tourly_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tourly_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourly_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tourly_user:tourly_pass@postgres:5432/tourly_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tourly_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
