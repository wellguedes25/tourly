version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tourly_postgres
    restart: always
    environment:
      POSTGRES_USER: tourly_user
      POSTGRES_PASSWORD: tourly_pass
      POSTGRES_DB: tourly_db

  redis:
    image: redis:7-alpine
    container_name: tourly_redis
    restart: always

  backend:
    image: tourly_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourly_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://tourly_user:tourly_pass@postgres:5432/tourly_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis

  frontend:
    image: tourly_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tourly_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
